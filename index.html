<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Kit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="title">Drum Kit</div>
    </header>

    <section id="drums" class="drums">
      <div class="pads-container">
        <div class="pad">
          <div class="sound">Crash</div>
          <div class="key">Key: C</div>
        </div>
        <div class="pad">
          <div class="sound">Ride</div>
          <div class="key">Key: X</div>
        </div>
        <div class="pad">
          <div class="sound">Tom2</div>
          <div class="key">Key: D</div>
        </div>
        <div class="pad">
          <div class="sound">Tom1</div>
          <div class="key">Key: Z</div>
        </div>
        <div class="pad">
          <div class="sound">Clap</div>
          <div class="key">Key: S</div>
        </div>
        <div class="pad">
          <div class="sound">Open Hi-Hat</div>
          <div class="key">Key: A</div>
        </div>
        <div class="pad">
          <div class="sound">Snare</div>
          <div class="key">Key: W</div>
        </div>
        <div class="pad">
          <div class="sound">Closed Hi-Hat</div>
          <div class="key">Key: E</div>
        </div>
        <div class="pad">
          <div class="sound">Kick</div>
          <div class="key">Key: Q</div>
        </div>
      </div>
    </section>
    <script src="./index.js"></script>
  </body>
</html>
